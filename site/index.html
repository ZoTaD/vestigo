<!doctype html>
<!-- English is the default language; App syncs this to a remembered choice. --><html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console ownership. Inert: no script, no tracking. Must stay
         for verification to hold, so it lives in the static head, not PageMeta. -->
    <meta name="google-site-verification" content="4jK5_InU6h2IIDAW8-Nk8eOG_7uyJlqfL3MbFvKaShM" />
    <title>Vestigo — Tier lists, builds and data for the games you play</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#080d1a" />
    <meta
      name="description"
      content="Tier lists, builds, guides and tools built from each game&#39;s own data: Deadlock, Path of Exile 2 and Valheim."
    />

    <!--
      These are duplicated from PageMeta on purpose, and they are the ones that
      actually matter for link previews.

      Discord, Twitter, WhatsApp and friends do not run JavaScript: they read the
      HTML as served and stop. Whatever PageMeta writes on navigation is invisible
      to them, so without these tags a shared link would preview as a bare
      rectangle no matter how carefully the app rewrites its head. Google does run
      JS, which is why per-page titles still reach search.

      Keep them describing the site as a whole — they are what every link shows.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vestigo" />
    <meta property="og:title" content="Vestigo — Tier lists, builds and data for the games you play" />
    <meta
      property="og:description"
      content="Tier lists, builds, guides and tools built from each game&#39;s own data: Deadlock, Path of Exile 2 and Valheim."
    />
    <meta property="og:url" content="https://vestigo.gg/en" />
    <meta property="og:image" content="https://vestigo.gg/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vestigo — play, review, improve" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vestigo — Tier lists, builds and data for the games you play" />
    <meta
      name="twitter:description"
      content="Tier lists, builds, guides and tools built from each game&#39;s own data: Deadlock, Path of Exile 2 and Valheim."
    />
    <meta name="twitter:image" content="https://vestigo.gg/og.jpg" />
    <!--
      Las fuentes del sitio (Big Shoulders Display, Barlow, Barlow Condensed y la
      Cinzel de PoE2) se sirven desde el propio dominio desde el 2026-09-25: las
      importa `src/fonts.ts` desde los paquetes @fontsource y Vite las emite en
      /assets con hash, así que se guardan un año. Antes venían de Google Fonts,
      que eran dos conexiones más (googleapis + gstatic) antes de ver la letra.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
