# The site lives in `site/` (until 2026-09-25 in `games/tft/ui`, from when TFT
# was the only game), so Netlify needs to be told where to build from.
# `publish` is resolved relative to `base`.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

  # Without this line the tier lists stop reaching the site.
  #
  # When a base directory is set, Netlify's default is to skip the build unless
  # the push changed something INSIDE it. The publish Actions commit only each
  # game's `data/*.json`, which live outside the site's folder — so every
  # automatic publication was skipped, silently and with a green Action
  # (measured on the first one, commit fb490fa, back when TFT was the game).
  #
  # The data IS the site: it gets bundled into the JS at build time. So the build
  # has to watch it too. `:/` makes each path relative to the repo root rather
  # than to the base directory, which is where this command runs.
  #
  # netlify.toml is on the list on purpose: a change to how the site is built
  # should rebuild it, and it is what makes this very commit deploy.
  #
  # Exit 0 means "skip". `git diff --quiet` exits 0 only when nothing changed, so
  # anything unexpected — an empty $CACHED_COMMIT_REF on a first build, a bad
  # path — fails the command and builds, which is the safe direction to fail.
  #
  # Un juego nuevo suma acá su `games/<juego>/data`: si no, la Action que lo
  # actualiza queda en verde con el sitio sirviendo los datos viejos.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/site :/games/deadlock/data :/games/poe2/data :/games/valheim/data :/games/d2r/data :/games/zomboid/data :/netlify.toml"

[build.environment]
  # Pinned so a Netlify default upgrade never changes the build under us.
  NODE_VERSION = "22"
  # Project Zomboid (2026-10-03) trajo miles de JSON y el build pasó los 2 GB de heap que da Node por defecto:
  # sin esto, Netlify corta con "JavaScript heap out of memory" a mitad de la transformación.
  NODE_OPTIONS = "--max-old-space-size=6144"

# Every screen has a real URL (/en/deadlock/items/frenzy and friends), but the app
# is still a single HTML file that reads the path at runtime. This hands any
# path to that file with a 200 rather than a redirect, so the address the
# visitor asked for is the address they keep — a 301 to "/" would collapse every
# page we just asked Google to index back into one.
#
# TFT salió del sitio el 2026-09-15 y del repo el 2026-09-25. Sus direcciones
# estaban indexadas y compartidas, así que se contestan con 301 a la portada del
# mismo idioma: es lo que le dice a Google que las saque del índice, y lo que a
# un link viejo lo deja en el sitio en vez de en una página vacía. Quedan aunque
# TFT ya no esté: sacarlas devolvería esas URLs a un 200 con la portada.
#
# Van ANTES del comodín de abajo: Netlify aplica la primera regla que coincide,
# y el comodín las serviría con 200. La forma sin barra va aparte porque el
# splat no la cubre con seguridad. Sin `force`: ya no hay archivo en esas rutas.
# Baba (héroe 88) salió sin catálogo el 5/10 y sus páginas se publicaron con el id.
[[redirects]]
  from = "/en/deadlock/heroes/88"
  to = "/en/deadlock/heroes/baba"
  status = 301
[[redirects]]
  from = "/en/deadlock/88"
  to = "/en/deadlock/baba"
  status = 301
[[redirects]]
  from = "/es/deadlock/heroes/88"
  to = "/es/deadlock/heroes/baba"
  status = 301
[[redirects]]
  from = "/es/deadlock/88"
  to = "/es/deadlock/baba"
  status = 301
[[redirects]]
  from = "/en/tft"
  to = "/en"
  status = 301
[[redirects]]
  from = "/en/tft/*"
  to = "/en"
  status = 301
[[redirects]]
  from = "/es/tft"
  to = "/es"
  status = 301
[[redirects]]
  from = "/es/tft/*"
  to = "/es"
  status = 301
[[redirects]]
  from = "/tft"
  to = "/en"
  status = 301
[[redirects]]
  from = "/tft/*"
  to = "/en"
  status = 301

# `/zomboid` era un atajo a la sección (2026-09-30); ahora manda con 301 a la
# dirección de verdad. La carpeta `/zomboid/...` es de assets (íconos, mapa).
[[redirects]]
  from = "/zomboid"
  to = "/en/project-zomboid"
  status = 301
[[redirects]]
  from = "/en/zomboid"
  to = "/en/project-zomboid"
  status = 301
[[redirects]]
  from = "/es/zomboid"
  to = "/es/project-zomboid"
  status = 301

# Un chunk que ya no existe (una pestaña abierta de antes de un deploy pide el
# nombre viejo) contesta 404 y no la página: `/assets/*` se guarda como
# "immutable" (ver las cabeceras de abajo), y un `index.html` guardado un año
# bajo el nombre de un `.js` no le sirve a nadie. La carga falla igual que antes
# y `staleChunks.ts` recarga la pestaña. Sin `force`: el archivo que existe se
# sirve antes de mirar esta regla.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Static files that exist on disk (sitemap.xml, robots.txt) are served
# before this rule is consulted, so they are not swallowed by it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Content-Security-Policy (2026-09-28, auditoría de seguridad): la lista de
# lugares de donde el navegador acepta cargar cosas en vestigo.gg. Es la red de
# contención si algún día un dato de afuera (deadlock-api, Steam, la wiki) trajera
# código: aunque llegara a la página, no se ejecutaría. Scripts sólo del sitio y
# de Google Analytics (que se carga recién con el consentimiento); nada inline,
# porque el sitio no tiene scripts inline (el JSON-LD es un bloque de datos, que
# la CSP no bloquea). Estilos inline sí: React escribe `style=` en muchos lugares.
#
# **Un origen nuevo tiene que sumarse acá**, o el navegador lo bloquea en
# silencio (queda en la consola). `vite preview` lee esta misma línea
# (`netlifyCsp()` en site/vite.config.ts), así que se prueba antes de publicar.
#   - assets-bucket.deadlock-api.com: fuentes del juego, videos de habilidades y
#     las imágenes que no se sirven desde el sitio.
#   - api.deadlock-api.com: buscador de jugadores, perfiles y partidas.
#   - *.steamstatic.com: avatares de Steam.   web.poecdn.com: imágenes de PoE2.
#   - Google Analytics: googletagmanager.com y los *.google-analytics.com.
#
# Permissions-Policy apaga lo que el sitio nunca usa (cámara, micrófono, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://assets-bucket.deadlock-api.com https://web.poecdn.com https://*.steamstatic.com https://*.googletagmanager.com https://*.google-analytics.com; font-src 'self' https://assets-bucket.deadlock-api.com; media-src 'self' https://assets-bucket.deadlock-api.com; connect-src 'self' https://api.deadlock-api.com https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()"

# El JS y el CSS que arma Vite (2026-09-25). Cada nombre lleva el hash de su
# contenido (`index-Dgbjy9ln.js`): si el archivo cambia, cambia el nombre, así
# que un nombre dado es siempre el mismo archivo y "immutable" es seguro. Hasta
# acá salían con el `max-age=0, must-revalidate` de Netlify, y cada visita
# volvía a preguntar por cada chunk aunque lo tuviera guardado.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las imágenes y fuentes de cada juego. Estos nombres NO llevan hash: salen del
# juego (`game_assets.py`, el árbol de PoE2, la wiki de Valheim) y un parche
# puede pisar un archivo con el mismo nombre. Por eso un día y no un año: dentro
# del día no se pide nada, y pasado el día se muestra lo guardado mientras se
# revisa en segundo plano (`stale-while-revalidate`), sin hacer esperar a nadie.
#
# Carpeta por carpeta y no `/deadlock/*`: las rutas sin idioma (`/deadlock/paige`)
# son páginas que el comodín de abajo contesta con `index.html`, y un HTML con
# un día de caché seguiría pidiendo chunks borrados después de un deploy. Por
# eso los sprites del árbol viven en `tree-sprites/` y no en `tree/`, que es la
# ruta de la página. Una carpeta nueva de assets tiene que sumarse acá.
[[headers]]
  for = "/deadlock/game/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/deadlock/shop/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
