# The site lives in a subdirectory of this repo, so Netlify needs to be told
# where to build from. `publish` is resolved relative to `base`.
[build]
  base = "games/tft/ui"
  command = "npm run build"
  publish = "dist"

  # Without this line the tier list stops reaching the site.
  #
  # When a base directory is set, Netlify's default is to skip the build unless
  # the push changed something INSIDE it. The daily publish Action commits only
  # `games/tft/data/*.json`, which lives outside `games/tft/ui` — so every
  # automatic publication was skipped, silently and with a green Action. Measured
  # on the first one (commit fb490fa): the site kept serving the previous day's
  # meta half an hour later.
  #
  # The data IS the site: it gets bundled into the JS at build time. So the build
  # has to watch it too. `:/` makes each path relative to the repo root rather
  # than to the base directory, which is where this command runs.
  #
  # netlify.toml is on the list on purpose: a change to how the site is built
  # should rebuild it, and it is what makes this very commit deploy.
  #
  # Exit 0 means "skip". `git diff --quiet` exits 0 only when nothing changed, so
  # anything unexpected — an empty $CACHED_COMMIT_REF on a first build, a bad
  # path — fails the command and builds, which is the safe direction to fail.
  # `games/deadlock/data` está por la misma razón exacta, y se agregó el
  # 2026-07-29 junto con la tier list de Deadlock: esos JSON también se empaquetan
  # dentro del bundle en tiempo de build. Sin esta ruta, la Action que los
  # actualiza todos los días habría quedado en verde con el sitio sirviendo la
  # tier list del día que se publicó — el mismo fallo que costó descubrir arriba,
  # repetido para el segundo juego.
  # `games/valheim/data` desde el 2026-09-24: la sección y la Crónica se
  # actualizan a mano por parche y sólo tocan esos JSON.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/games/tft/ui :/games/tft/data :/games/deadlock/data :/games/poe2/data :/games/valheim/data :/netlify.toml"

[build.environment]
  # Pinned so a Netlify default upgrade never changes the build under us.
  NODE_VERSION = "22"

# Every screen has a real URL now (/en/tft/units/jinx and friends), but the app
# is still a single HTML file that reads the path at runtime. This hands any
# path to that file with a 200 rather than a redirect, so the address the
# visitor asked for is the address they keep — a 301 to "/" would collapse every
# page we just asked Google to index back into one.
#
# TFT salió del sitio el 2026-09-15 (ver games/tft/ui/src/route.ts). Sus
# direcciones estaban indexadas y compartidas, así que se contestan con 301 a la
# portada del mismo idioma: es lo que le dice a Google que las saque del índice,
# y lo que a un link viejo lo deja en el sitio en vez de en una página vacía.
#
# Van ANTES del comodín de abajo: Netlify aplica la primera regla que coincide,
# y el comodín las serviría con 200. La forma sin barra va aparte porque el
# splat no la cubre con seguridad. Sin `force`: ya no hay archivo en esas rutas.
[[redirects]]
  from = "/en/tft"
  to = "/en"
  status = 301
[[redirects]]
  from = "/en/tft/*"
  to = "/en"
  status = 301
[[redirects]]
  from = "/es/tft"
  to = "/es"
  status = 301
[[redirects]]
  from = "/es/tft/*"
  to = "/es"
  status = 301
[[redirects]]
  from = "/tft"
  to = "/en"
  status = 301
[[redirects]]
  from = "/tft/*"
  to = "/en"
  status = 301

# Un chunk que ya no existe (una pestaña abierta de antes de un deploy pide el
# nombre viejo) contesta 404 y no la página: `/assets/*` se guarda como
# "immutable" (ver las cabeceras de abajo), y un `index.html` guardado un año
# bajo el nombre de un `.js` no le sirve a nadie. La carga falla igual que antes
# y `staleChunks.ts` recarga la pestaña. Sin `force`: el archivo que existe se
# sirve antes de mirar esta regla.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Static files that exist on disk (sitemap.xml, robots.txt, riot.txt) are served
# before this rule is consulted, so they are not swallowed by it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Las imágenes del catálogo (games/tft/pipeline/src/images.ts) viven bajo
# /img/set<N>/ con un nombre derivado del hash de su URL de origen. Esa ruta
# jamás cambia de contenido: un archivo con ese nombre siempre es la misma
# imagen, y un cambio de set escribe en una carpeta /img/set<N+1>/ nueva en vez
# de pisar esta. Por eso "immutable" es seguro acá — nada le exige a un
# visitante volver a pedir un archivo que ya tiene en caché.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El JS y el CSS que arma Vite (2026-09-25). Cada nombre lleva el hash de su
# contenido (`index-Dgbjy9ln.js`): si el archivo cambia, cambia el nombre, así
# que un nombre dado es siempre el mismo archivo y "immutable" es seguro. Hasta
# acá salían con el `max-age=0, must-revalidate` de Netlify, y cada visita
# volvía a preguntar por cada chunk aunque lo tuviera guardado.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las imágenes y fuentes de cada juego. Estos nombres NO llevan hash: salen del
# juego (`game_assets.py`, el árbol de PoE2, la wiki de Valheim) y un parche
# puede pisar un archivo con el mismo nombre. Por eso un día y no un año: dentro
# del día no se pide nada, y pasado el día se muestra lo guardado mientras se
# revisa en segundo plano (`stale-while-revalidate`), sin hacer esperar a nadie.
#
# Carpeta por carpeta y no `/deadlock/*`: las rutas sin idioma (`/deadlock/paige`)
# son páginas que el comodín de abajo contesta con `index.html`, y un HTML con
# un día de caché seguiría pidiendo chunks borrados después de un deploy. Por
# eso los sprites del árbol viven en `tree-sprites/` y no en `tree/`, que es la
# ruta de la página. Una carpeta nueva de assets tiene que sumarse acá.
[[headers]]
  for = "/deadlock/game/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/deadlock/shop/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/poe2/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/poe2/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/poe2/tree-sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/poe2/ui/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/valheim/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/valheim/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/valheim/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/valheim/map/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/valheim/news/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/valheim/ui/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/valheim/wiki/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
