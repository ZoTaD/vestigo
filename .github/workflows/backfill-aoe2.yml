name: backfill aoe2 stats

# El recorrido completo de AoE2 (2026-11-26): el historial (~60 partidas) de todos los jugadores de los rankings de mapa
# aleatorio y Empire Wars (~95 mil), una sola vez o cuando haga falta, para llenar los últimos meses de partidas. Reescribe
# los días de la ventana (`--rehacer`) y deja en la caché las partidas contadas, así `publish-aoe2.yml` sigue sumando.
# Sólo a mano. Comparte el grupo de concurrencia con la diaria: nunca corren a la vez.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás que se reescriben"
        default: "120"

concurrency:
  group: publish-aoe2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # El tope de un trabajo de Actions es 6 h: el colector corta los historiales a las 4 h 30 y escribe lo juntado.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Las partidas ya contadas (2026-11-26, `games/aoe2/tools/vistas.py`): viajan de una corrida a la otra en la caché,
      # así cada día se suma a lo guardado en vez de reemplazarlo. La comparte con `backfill-aoe2.yml`.
      - name: vistas cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: games/aoe2/.cache
          key: aoe2-vistas-${{ github.run_id }}
          restore-keys: aoe2-vistas-

      # Una falla de la API no tumba el commit de lo que se haya juntado (`continue-on-error`); el colector tiene su
      # propio plazo para pedir historiales (`--deadline`) y escribe lo juntado.
      - name: backfill
        continue-on-error: true
        env:
          DAYS: ${{ inputs.days }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "::error::days tiene que ser un número"; exit 1;; esac
          python games/aoe2/tools/daily.py --todos --rehacer --days "$DAYS" --replays 0 --workers 12 --deadline 16200

      - name: guard
        id: guard
        run: |
          if [ -z "$(git status --porcelain -- games/aoe2/stats)" ]; then
            echo "nada cambió; no hay commit"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            git status --short -- games/aoe2/stats | head -20
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: commit
        if: steps.guard.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }
          git config user.name "vestigo-bot"
          git config user.email "67348048+ZoTaD@users.noreply.github.com"
          git add games/aoe2/stats
          git commit -m "chore: backfill AoE2 stats"
          empujado=0
          for intento in 1 2 3; do
            if git_auth push origin "HEAD:$GITHUB_REF_NAME"; then empujado=1; break; fi
            echo "push rechazado (intento $intento): traigo lo que llegó y reintento"
            git_auth fetch origin "$GITHUB_REF_NAME" || break
            git rebase "origin/$GITHUB_REF_NAME" || break
          done
          if [ "$empujado" != 1 ]; then
            echo "::error::no se pudo publicar después de 3 intentos"
            exit 1
          fi
