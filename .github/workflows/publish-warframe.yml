name: publish warframe data

# Los datos de Warframe, una vez por semana (lunes 09:30 UTC) y a mano.
#
# La fuente es el export oficial del juego: su índice trae un hash por archivo y
# la tabla de drops se compara por su sha256, así que `fetch.py --check` dice con
# pocos pedidos si algo cambió. Si es "igual", la corrida termina ahí. Si
# "cambió", baja los exports y la tabla de drops, rehace los datos del sitio y los
# íconos, y los publica con un commit a `main` (el repo no deja que Actions abra
# pull requests), igual que `publish-poe2`.
on:
  schedule:
    # Lejos de `publish-poe2` (08:45), `publish-deadlock` y `tests` (09:15).
    - cron: "30 9 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-warframe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Bajar ~30 exports, la tabla de drops y los íconos nuevos son unos minutos.
    timeout-minutes: 30
    steps:
      # Sin credenciales guardadas y con las actions fijadas por commit, igual que
      # `publish-poe2` (auditoría de seguridad del 2026-09-28).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: check
        id: check
        run: |
          resultado="$(python3 games/warframe/tools/fetch.py --check)"
          echo "índice: $resultado"
          echo "resultado=$resultado" >> "$GITHUB_OUTPUT"

      # Pillow es lo único que piden los scripts (los íconos se pasan a WebP).
      - name: dependencias
        if: steps.check.outputs.resultado == 'cambió'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pillow==12.3.0

      - name: datos
        if: steps.check.outputs.resultado == 'cambió'
        run: |
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" games/warframe/tools/fetch.py
          "$py" games/warframe/tools/site_data.py
          "$py" games/warframe/tools/images.py

      - name: commit
        if: steps.check.outputs.resultado == 'cambió'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- games/warframe/data site/public/warframe)" ]; then
            echo "el índice cambió pero los datos del sitio no: no hay commit"
            exit 0
          fi
          git status --short -- games/warframe/data site/public/warframe | head -20
          # El token, sólo acá y sólo para este comando (ver el checkout).
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }
          git config user.name "vestigo-bot"
          git config user.email "67348048+ZoTaD@users.noreply.github.com"
          git add games/warframe/data site/public/warframe
          git commit -m "chore(warframe): datos del $(date -u +%Y-%m-%d)"
          # El push se reintenta rebaseando sobre lo que llegó, igual que en
          # `publish-poe2`: esta corrida sólo toca los datos de Warframe.
          empujado=0
          for intento in 1 2 3; do
            if git_auth push origin "HEAD:$GITHUB_REF_NAME"; then empujado=1; break; fi
            echo "push rechazado (intento $intento): traigo lo que llegó y reintento"
            git_auth fetch origin "$GITHUB_REF_NAME" || break
            git rebase "origin/$GITHUB_REF_NAME" || break
          done
          if [ "$empujado" != 1 ]; then
            echo "::error::no se pudo publicar después de 3 intentos"
            exit 1
          fi
