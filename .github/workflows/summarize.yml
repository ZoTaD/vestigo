name: summarize matches

# Resumir dejó de caber en la publicación diaria.
#
# Mientras entraban ~800 partidas por día, el paso `summarize` de publish.yml —una
# corrida, 2.000 partidas de tope— las cubría de sobra. Con el cron cada 5 minutos
# entran ~4.800, así que una sola corrida diaria se queda corta y las partidas se
# acumulan sin resumir. Y una partida sin resumir **no se puede borrar**: la ventana
# de retención solo toca lo que ya está contabilizado. O sea que quedarse atrás no
# sería solo publicar viejo, sería llenar la base.
#
# Cuatro corridas por día a 2.500 dan 10.000 de capacidad contra ~4.800 que entran:
# el doble de margen, para que un día con la key caída y otro de recuperación no
# dejen deuda acumulada.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      retention:
        description: >-
          Cuántas partidas crudas conservar en esta corrida. Vacío = el valor por
          defecto del código. Bajarlo fuerza a archivar y borrar, que es la única
          forma de probar que R2 escribe de verdad antes del día en que haga falta.
        required: false
        type: string

# No cancela la corrida anterior: si una tarda más de lo esperado, prefiero que la
# siguiente espere a que dos escriban contadores a la vez. El lock de
# `pipeline_locks` ya lo impediría igual, pero mejor no depender de eso.
concurrency:
  group: summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    # Un lote de 8 partidas por transacción: 2.500 son ~310 llamadas. Media hora es
    # holgado, y el tope existe para que un cuelgue no bloquee las corridas siguientes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/tft/*/package-lock.json

      - name: install
        run: npm ci --prefix games/tft/pipeline

      # Los scripts del pipeline corren con `node --env-file=.env`, que falla si el
      # archivo no existe. .env está en .gitignore, así que no puede commitearse.
      #
      # CLOUDFLARE_API_TOKEN: la base es D1, no Supabase (ver d1.ts). Sólo tiene
      # permisos de D1 Read/Write sobre la cuenta, nada de Workers ni R2.
      #
      # R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY: hacen falta para archivar en R2 antes
      # de borrar partidas crudas (ver deleteOldRaw en summarize-run.ts) — sin ellas,
      # summarize-run.ts falla en cuanto hay algo para archivar, a propósito: nunca
      # debe borrar sin haber podido subir primero.
      - name: env
        run: |
          printf 'CLOUDFLARE_API_TOKEN=%s\nR2_ACCESS_KEY_ID=%s\nR2_SECRET_ACCESS_KEY=%s\n' \
            "${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "${{ secrets.R2_ACCESS_KEY_ID }}" "${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            > games/tft/pipeline/.env

      # Sin continue-on-error, a propósito: si esto falla en silencio, la tier list
      # deja de moverse y la base se llena, y las dos cosas tardan días en notarse.
      - name: summarize
        env:
          SUMMARIZE_LIMIT: "2500"
          RAW_RETENTION_MATCHES: ${{ inputs.retention }}
        run: npm run summarize --prefix games/tft/pipeline
