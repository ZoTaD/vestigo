# La API de vestigo.gg (api/: login con Steam y Deadlockdle) en Cloudflare Workers.
#
# Se publica sola cuando cambia su código en main. Los datos del Deadlockdle no
# pasan por acá: el pozo lo publica el sitio todos los días (deploy.yml) y el
# Worker lo lee de vestigo.gg. El token de Cloudflare sólo puede tocar Workers y
# D1 de esta cuenta; lo cargó ZoTaD en los secretos del repo.
name: deploy api

on:
  push:
    branches: [main]
    paths:
      - api/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: test
        working-directory: api
        run: |
          npm ci
          npm test
          npx tsc -p .

      - name: publish
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply vestigo-api --remote
          npx wrangler deploy
