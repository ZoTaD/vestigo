<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vestigo">
  <!--
    The site's mark: a gold V on midnight, ringed like a wax seal.

    Drawn for 16px first, which is the only size that really matters in a tab.
    The stroke is heavy and the ring has room to breathe, because a thin serif V
    — closer to the Cinzel the site sets its headings in — turns to mud at that
    scale. The gradient is the one flourish that survives: it catches the light
    the way gold leaf does on the pages themselves.
  -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d391" />
      <stop offset="100%" stop-color="#c9a24a" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="#0b1222" />
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#leaf)" stroke-width="2.5" opacity="0.85" />
  <path
    d="M19 19 L32 45 L45 19"
    fill="none"
    stroke="url(#leaf)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
