<!doctype html>
<!-- English is the default language; App syncs this to a remembered choice. --><html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console ownership. Inert: no script, no tracking. Must stay
         for verification to hold, so it lives in the static head, not PageMeta. -->
    <meta name="google-site-verification" content="4jK5_InU6h2IIDAW8-Nk8eOG_7uyJlqfL3MbFvKaShM" />
    <title>Vestigo — Get better at the games you play</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#080d1a" />
    <meta
      name="description"
      content="Vestigo reads your finished matches and turns them into something you can act on before the next game: a high-elo meta report, unit and item stats, and analysis of your own history."
    />

    <!--
      These are duplicated from PageMeta on purpose, and they are the ones that
      actually matter for link previews.

      Discord, Twitter, WhatsApp and friends do not run JavaScript: they read the
      HTML as served and stop. Whatever PageMeta writes on navigation is invisible
      to them, so without these tags a shared link would preview as a bare
      rectangle no matter how carefully the app rewrites its head. Google does run
      JS, which is why per-page titles still reach search.

      Keep them describing the site as a whole — they are what every link shows.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vestigo" />
    <meta property="og:title" content="Vestigo — Get better at the games you play" />
    <meta
      property="og:description"
      content="Your matches already hold the answer. Vestigo reads them back to you: a high-elo meta report for Teamfight Tactics, unit and item stats, and analysis of your own history."
    />
    <meta property="og:url" content="https://vestigo.gg/en" />
    <meta property="og:image" content="https://vestigo.gg/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vestigo — play, review, improve" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vestigo — Get better at the games you play" />
    <meta
      name="twitter:description"
      content="Your matches already hold the answer. Vestigo reads them back to you: a high-elo meta report for Teamfight Tactics, unit and item stats, and analysis of your own history."
    />
    <meta name="twitter:image" content="https://vestigo.gg/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Tres familias, una sola voz para todo el sitio desde el rediseño del
      2026-09-06 (ver `tokens.css`): Big Shoulders Display titula y lleva las
      cifras grandes, Barlow es el texto y los controles, Barlow Condensed las
      columnas numéricas angostas.

      Cinzel, Cormorant Garamond y Marcellus SC se retiraron ese día: ninguna
      regla las nombra ya (las hojas usan `--font-display` / `--font-text`).
      Antes de sumar una familia nueva, buscar si ya hay una cargada que sirva.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
